<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Muestra de Informática - Shows de Drones RA</title>
  
  <!-- Carga de A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* Estilos del botón de audio flotante */
    #btn-audio {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999; /* Asegura que el botón quede SIEMPRE por encima de la cámara */
      pointer-events: auto;
      padding: 14px 28px;
      background-color: #007bff;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-audio:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- Botón de control de sonido -->
  <button id="btn-audio">🔊 Activar Sonido</button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- PRECARGA DE VIDEOS -->
    <a-assets>
      <video id="video1" src="assets/show1.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video2" src="assets/show2.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video3" src="assets/show3.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video4" src="assets/show4.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video5" src="assets/show5.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video6" src="assets/show6.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video7" src="assets/show7.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video8" src="assets/show8.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video9" src="assets/show9.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      <video id="video10" src="assets/show10.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <!-- PROYECTO 1 -->
    <a-marker type="pattern" url="targets/patron1.patt" id="marker1">
      <!-- Mantenemos width 0.9 y height 1.6 para formato VERTICAL -->
      <a-video src="#video1" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 2 -->
    <a-marker type="pattern" url="targets/patron2.patt" id="marker2">
      <a-video src="#video2" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 3 -->
    <a-marker type="pattern" url="targets/patron3.patt" id="marker3">
      <a-video src="#video3" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 4 -->
    <a-marker type="pattern" url="targets/patron4.patt" id="marker4">
      <a-video src="#video4" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 5 -->
    <a-marker type="pattern" url="targets/patron5.patt" id="marker5">
      <a-video src="#video5" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 6 -->
    <a-marker type="pattern" url="targets/patron6.patt" id="marker6">
      <a-video src="#video6" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 7 -->
    <a-marker type="pattern" url="targets/patron7.patt" id="marker7">
      <a-video src="#video7" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 8 -->
    <a-marker type="pattern" url="targets/patron8.patt" id="marker8">
      <a-video src="#video8" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 9 -->
    <a-marker type="pattern" url="targets/patron9.patt" id="marker9">
      <a-video src="#video9" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- PROYECTO 10 -->
    <a-marker type="pattern" url="targets/patron10.patt" id="marker10">
      <a-video src="#video10" width="0.9" height="1.6" position="0 0.8 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <!-- LÓGICA DE CONTROL -->
  <script>
    const videos = Array.from(document.querySelectorAll('video'));
    const btnAudio = document.getElementById('btn-audio');
    let isMuted = true;

    // Control de detección de marcadores
    for (let i = 1; i <= 10; i++) {
      const marker = document.getElementById(`marker${i}`);
      const video = document.getElementById(`video${i}`);

      if (marker && video) {
        marker.addEventListener('markerFound', () => {
          video.play().catch(e => console.log("Error al reproducir:", e));
        });

        marker.addEventListener('markerLost', () => {
          video.pause();
        });
      }
    }

    // Evento para alternar el sonido
    btnAudio.addEventListener('click', (e) => {
      e.stopPropagation(); // Evita interferencias con eventos de A-Frame
      isMuted = !isMuted;

      videos.forEach(v => {
        v.muted = isMuted;
      });

      if (isMuted) {
        btnAudio.innerText = "🔊 Activar Sonido";
        btnAudio.style.backgroundColor = "#007bff";
      } else {
        btnAudio.innerText = "🔇 Silenciar";
        btnAudio.style.backgroundColor = "#dc3545";
      }
    });
  </script>
</body>
</html>
